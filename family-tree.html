<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Marson Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07080d;
  --bg2: #0e1120;
  --ink: #f3ece0;
  --muted: #9a93a8;
  --faint: #5b566a;
  --gold: #e9c46a;
  --gold2: #f6dfa0;
  --dad: #7fb2e5;
  --mum: #eaa37a;
  --card: rgba(22, 24, 40, 0.72);
  --card-hi: rgba(34, 36, 58, 0.9);
  --line: rgba(233, 196, 106, 0.42);
  --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: radial-gradient(1200px 800px at 50% 110%, #1a1430 0%, transparent 60%),
              radial-gradient(900px 700px at 15% -10%, #0f1d33 0%, transparent 55%),
              var(--bg);
  color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased;
}
#motes { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

/* ---------- Intro ---------- */
#intro {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: radial-gradient(800px 600px at 50% 60%, #15122a 0%, #07080d 70%);
  transition: opacity 1s ease, transform 1.2s cubic-bezier(.2,.7,.2,1), filter 1s ease;
  cursor: pointer;
}
#intro.out { opacity: 0; transform: scale(1.15); filter: blur(6px); pointer-events: none; }
#intro .stage { display: grid; place-items: center; text-align: center; padding: 16px; }
#introTree { width: min(560px, 86vw); height: auto; overflow: visible; }
#introTree path { fill: none; stroke: url(#goldGrad); stroke-linecap: round;
  stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .7s cubic-bezier(.4,0,.2,1) forwards; }
#introTree circle { fill: var(--gold2); opacity: 0; transform-box: fill-box; transform-origin: center;
  filter: drop-shadow(0 0 6px rgba(246,223,160,.9)); animation: bloom .6s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes bloom { 0% { opacity: 0; transform: scale(0); } 60% { opacity: 1; transform: scale(1.6); } 100% { opacity: .85; transform: scale(1); } }
#intro h1 {
  font-family: var(--serif); font-weight: 600; font-size: clamp(40px, 8vw, 84px); line-height: 1;
  margin: 8px 0 10px; letter-spacing: .01em;
  color: var(--gold2); text-shadow: 0 0 34px rgba(233,196,106,.45), 0 2px 0 rgba(120,80,20,.35);
}
#intro h1 span { display: inline-block; opacity: 0; transform: translateY(24px); filter: blur(8px);
  animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes rise { to { opacity: 1; transform: none; filter: none; } }
@keyframes shine { 0%,100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
#intro .tag { font-size: clamp(12px, 2.2vw, 15px); letter-spacing: .32em; text-transform: uppercase;
  color: var(--muted); opacity: 0; animation: rise 1s ease 2.6s forwards; }
#intro .skip { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
  font-size: 12px; color: var(--faint); letter-spacing: .2em; text-transform: uppercase;
  opacity: 0; animation: rise 1s ease 1s forwards; }

/* ---------- Header & controls ---------- */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
  padding: 16px 20px; pointer-events: none;
  background: linear-gradient(to bottom, rgba(7,8,13,.9), rgba(7,8,13,0));
}
header > * { pointer-events: auto; }
.brand h2 { font-family: var(--serif); font-weight: 600; font-size: 28px; margin: 0; line-height: 1;
  background: linear-gradient(90deg, var(--gold2), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand p { margin: 4px 0 0; font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.search { margin-left: auto; position: relative; }
.search input {
  width: 240px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
  color: var(--ink); border-radius: 999px; padding: 10px 16px 10px 38px; font: inherit; font-size: 14px; outline: none;
  transition: border-color .2s, background .2s, width .3s;
}
.search input:focus { border-color: rgba(233,196,106,.6); background: rgba(255,255,255,.09); width: 280px; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); }
.results { position: absolute; right: 0; top: calc(100% + 8px); width: 300px; max-height: 50vh; overflow: auto;
  background: rgba(16,18,30,.97); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 6px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5); display: none; }
.results.show { display: block; }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--ink);
  padding: 9px 12px; border-radius: 9px; font: inherit; font-size: 14px; cursor: pointer; }
.results button:hover, .results button.active { background: rgba(233,196,106,.12); }
.results small { display: block; color: var(--muted); font-size: 12px; }

.controls { position: fixed; right: 20px; bottom: 20px; z-index: 20; display: flex; flex-direction: column; gap: 8px; }
.controls button, .chip-btn {
  width: 44px; height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,.1);
  background: rgba(20,22,36,.85); color: var(--ink); cursor: pointer; display: grid; place-items: center;
  backdrop-filter: blur(10px); transition: transform .15s, border-color .2s, background .2s;
}
.controls button:hover { border-color: rgba(233,196,106,.6); transform: translateY(-1px); }
.controls svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

.legend { position: fixed; left: 20px; bottom: 20px; z-index: 20; display: flex; gap: 14px; flex-wrap: wrap;
  font-size: 12px; color: var(--muted); background: rgba(14,16,28,.7); border: 1px solid rgba(255,255,255,.06);
  padding: 10px 14px; border-radius: 12px; backdrop-filter: blur(10px); max-width: calc(100vw - 100px); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.hint { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 19; font-size: 12px;
  color: var(--faint); letter-spacing: .12em; text-transform: uppercase; transition: opacity 1s; pointer-events: none; }

/* ---------- Chart ---------- */
#viewport { position: fixed; inset: 0; z-index: 1; cursor: grab; touch-action: none; }
#viewport.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#links path { fill: none; stroke: var(--line); stroke-width: 1.6; stroke-dasharray: 1; stroke-dashoffset: 1;
  transition: stroke .4s, stroke-width .4s, filter .4s; }
#links path.in { animation: draw 1s cubic-bezier(.4,0,.2,1) forwards; animation-delay: var(--d, 0s); }
#links path.lit { stroke: var(--gold); stroke-width: 2.6; filter: drop-shadow(0 0 6px rgba(233,196,106,.8)); }
#links circle { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; opacity: 0; transition: opacity .6s, stroke .4s; }
#links circle.in { opacity: 1; transition-delay: var(--d, 0s); }
#links circle.lit { stroke: var(--gold); fill: var(--gold); }

.gen-tag { position: absolute; font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--faint);
  white-space: nowrap; transform: translate(-100%, -50%); opacity: 0; transition: opacity 1s; pointer-events: none; }
.gen-tag.in { opacity: .9; }

.card {
  position: absolute; width: 210px; height: 108px; border-radius: 18px; padding: 14px 14px 12px 14px;
  background: var(--card); border: 1px solid rgba(255,255,255,.08);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; gap: 12px; align-items: center; cursor: pointer; overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
  opacity: 0; transform: translateY(26px) scale(.86);
  transition: opacity .7s ease, transform .7s cubic-bezier(.2,.9,.25,1.15), border-color .3s, box-shadow .3s, background .3s;
}
.card.in { opacity: 1; transform: none; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--side); opacity: .9; }
.card::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 30%, rgba(255,240,200,.14) 48%, transparent 66%);
  transform: translateX(-120%); transition: transform .9s ease; }
.card:hover { border-color: rgba(233,196,106,.55); background: var(--card-hi);
  box-shadow: 0 16px 40px rgba(0,0,0,.5), 0 0 0 1px rgba(233,196,106,.2), 0 0 30px rgba(233,196,106,.15); transform: translateY(-4px); }
.card:hover::after { transform: translateX(120%); }
.card.probable { border-style: dashed; }
.card.lit { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 34px rgba(233,196,106,.35); }
.card.selected { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 1px var(--gold), 0 0 24px rgba(233,196,106,.3); } 50% { box-shadow: 0 0 0 2px var(--gold2), 0 0 48px rgba(233,196,106,.55); } }
.card.root { width: 230px; background: linear-gradient(135deg, rgba(60,50,20,.65), rgba(22,24,40,.8)); border-color: rgba(233,196,106,.5); }
.card.dad { --side: var(--dad); } .card.mum { --side: var(--mum); } .card.you { --side: var(--gold); }

.av { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--serif); font-weight: 700; font-size: 20px; color: #120f08; position: relative;
  background: linear-gradient(135deg, var(--gold2), var(--side, var(--gold))); background-size: cover; background-position: center; }
.av.photo { color: transparent; box-shadow: 0 0 0 2px var(--side, var(--gold)); }
.card .txt { min-width: 0; }
.card .nm { font-family: var(--serif); font-weight: 700; font-size: 18px; line-height: 1.05; margin: 0 0 4px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .yr { font-size: 12px; color: var(--gold2); opacity: .9; letter-spacing: .02em; }
.card .pl { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; max-width: 118px; }
.card .sibs { position: absolute; right: 8px; bottom: 7px; font-size: 10px; color: var(--muted);
  border: 1px solid rgba(255,255,255,.1); border-radius: 999px; padding: 1px 7px; background: rgba(0,0,0,.25); }
.card .flag { position: absolute; right: 9px; bottom: 7px; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }

/* ---------- Profile ---------- */
#scrim { position: fixed; inset: 0; z-index: 29; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .4s; }
#scrim.show { opacity: 1; pointer-events: auto; }
#profile {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); z-index: 30;
  background: linear-gradient(180deg, rgba(20,20,36,.97), rgba(10,11,20,.98));
  border-left: 1px solid rgba(233,196,106,.18); box-shadow: -30px 0 80px rgba(0,0,0,.6);
  transform: translateX(105%); transition: transform .55s cubic-bezier(.2,.8,.2,1);
  overflow-y: auto; overscroll-behavior: contain;
}
#profile.open { transform: none; }
#profile .close { position: sticky; top: 14px; margin: 14px 14px -58px auto; display: grid; place-items: center; z-index: 3;
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.4);
  color: var(--ink); cursor: pointer; font-size: 20px; }
.hero { position: relative; padding: 46px 28px 22px; text-align: center; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: -40% -20% auto; height: 340px;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--side) 35%, transparent), transparent); opacity: .6; }
.portrait { position: relative; width: 148px; height: 148px; margin: 0 auto 18px; border-radius: 50%; }
.portrait .ring { position: absolute; inset: -6px; border-radius: 50%;
  background: conic-gradient(from 0deg, var(--gold), transparent 30%, var(--side) 55%, transparent 80%, var(--gold));
  animation: spin 6s linear infinite; -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); }
@keyframes spin { to { transform: rotate(360deg); } }
.portrait .pic { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--serif); font-size: 56px; font-weight: 700; color: #120f08;
  background: linear-gradient(135deg, var(--gold2), var(--side)); background-size: cover; background-position: center; }
.portrait .pic.photo { color: transparent; }
.rel { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; position: relative; }
.hero h3 { font-family: var(--serif); font-weight: 700; font-size: 38px; line-height: 1.02; margin: 0 0 6px; position: relative; }
.hero .nee { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 18px; position: relative; }
.hero .life { margin-top: 10px; color: var(--gold2); font-size: 15px; position: relative; }
.badges { display: flex; justify-content: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; position: relative; }
.badge { font-size: 11px; padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); color: var(--muted); }
.badge.ok { border-color: rgba(120,200,140,.5); color: #9fdcae; }
.badge.maybe { border-color: rgba(233,196,106,.5); color: var(--gold); }
.badge.fam { border-color: rgba(160,170,255,.45); color: #b8bfff; }
.photo-actions { display: flex; justify-content: center; gap: 8px; margin-top: 16px; position: relative; }
.photo-actions label, .photo-actions button { font: inherit; font-size: 12px; color: var(--ink); cursor: pointer;
  border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); border-radius: 999px; padding: 7px 14px; }
.photo-actions label:hover, .photo-actions button:hover { border-color: var(--gold); }
.photo-actions input { display: none; }

.sec { padding: 6px 28px 18px; }
.sec h4 { font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); margin: 12px 0 12px;
  display: flex; align-items: center; gap: 10px; }
.sec h4::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,.12), transparent); }
.story { font-family: var(--serif); font-size: 19px; line-height: 1.45; color: #e8e0d0; margin: 0; }
.tl { list-style: none; margin: 0; padding: 0 0 0 18px; position: relative; }
.tl::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 1px; background: linear-gradient(var(--gold), rgba(233,196,106,.1)); }
.tl li { position: relative; padding: 0 0 14px 12px; }
.tl li::before { content: ""; position: absolute; left: -18px; top: 6px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--bg); border: 2px solid var(--gold); }
.tl .when { font-size: 12px; color: var(--gold2); font-weight: 600; }
.tl .what { font-size: 14px; color: var(--ink); margin-top: 1px; }
.tl .where { font-size: 12px; color: var(--muted); }
.people { display: grid; gap: 8px; }
.person-link { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; cursor: pointer;
  background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.06); color: var(--ink); text-align: left; font: inherit; width: 100%;
  transition: border-color .2s, background .2s, transform .2s; }
.person-link:hover { border-color: rgba(233,196,106,.5); background: rgba(233,196,106,.07); transform: translateX(3px); }
.person-link.static { cursor: default; }
.person-link.static:hover { transform: none; border-color: rgba(255,255,255,.06); background: rgba(255,255,255,.035); }
.person-link .mini { width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center;
  font-family: var(--serif); font-weight: 700; color: #120f08; font-size: 14px;
  background: linear-gradient(135deg, var(--gold2), var(--side, var(--gold))); background-size: cover; background-position: center; }
.person-link .mini.ghost { background: rgba(255,255,255,.08); color: var(--muted); }
.person-link b { display: block; font-weight: 600; font-size: 14px; }
.person-link small { color: var(--muted); font-size: 12px; }
.person-link .go { margin-left: auto; color: var(--gold); opacity: .7; }
.ev { display: grid; gap: 10px; }
.ev-item { padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); }
.ev-item .src { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.ev-item .src .ic { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: rgba(233,196,106,.12); font-size: 12px; letter-spacing: 0; }
.ev-item p { margin: 6px 0 0; font-size: 13.5px; line-height: 1.5; color: #ddd6c8; }
.ev-item .ref { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.ev-item a { color: var(--gold2); font-size: 12px; text-decoration: none; display: inline-block; margin-top: 6px; }
.ev-item a:hover { text-decoration: underline; }
.empty { color: var(--muted); font-size: 13px; font-style: italic; }
.hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .32;
  filter: blur(2px) saturate(1.1); transform: scale(1.08); animation: drift 22s ease-in-out infinite alternate;
  -webkit-mask: linear-gradient(to bottom, #000 30%, transparent 100%); mask: linear-gradient(to bottom, #000 30%, transparent 100%); }
@keyframes drift { from { transform: scale(1.08) translate(0, 0); } to { transform: scale(1.18) translate(-2%, 1%); } }
.hero > *:not(.hero-bg) { position: relative; }
.places { display: grid; gap: 12px; }
.place { display: block; border-radius: 14px; overflow: hidden; text-decoration: none; color: inherit;
  background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07); transition: transform .25s, border-color .25s; }
.place:hover { transform: translateY(-2px); border-color: rgba(233,196,106,.5); }
.place .ph { height: 150px; background: linear-gradient(135deg, #2a2340, #14182a); background-size: cover; background-position: center;
  display: grid; place-items: center; font-size: 42px; transition: transform 6s ease; }
.place:hover .ph { transform: scale(1.06); }
.place .pc { padding: 12px 14px 14px; position: relative; background: rgba(14,15,26,.92); }
.place b { font-family: var(--serif); font-size: 19px; font-weight: 700; display: block; margin-bottom: 4px; }
.place p { margin: 0; font-size: 13px; line-height: 1.5; color: #d8d0c2; }
.place small { display: block; margin-top: 8px; font-size: 10.5px; color: var(--faint); }
.world { display: grid; gap: 2px; }
.wi { display: grid; grid-template-columns: 50px 1fr auto; gap: 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
.wy { font-family: var(--serif); font-weight: 700; font-size: 17px; color: var(--gold2); }
.wt { font-size: 13.5px; color: var(--ink); line-height: 1.4; }
.wa { font-size: 11px; color: var(--muted); white-space: nowrap; }
.next { font-size: 14px; line-height: 1.55; color: #e6dfd2; padding: 14px 16px; border-radius: 12px;
  background: linear-gradient(135deg, rgba(233,196,106,.1), rgba(233,196,106,.03)); border: 1px solid rgba(233,196,106,.25); }
.foot { padding: 10px 28px 40px; font-size: 11.5px; color: var(--faint); line-height: 1.5; }

@media (max-width: 720px) {
  header { padding: 12px 14px; flex-wrap: wrap; gap: 10px; }
  .brand h2 { font-size: 22px; }
  .search { margin-left: 0; width: 100%; }
  .search input, .search input:focus { width: 100%; }
  .results { width: 100%; }
  .legend { left: 12px; bottom: 12px; font-size: 11px; gap: 10px; padding: 8px 10px; max-width: calc(100vw - 80px); }
  .controls { right: 12px; bottom: 12px; }
  .hint { display: none; }
  #profile { top: auto; height: 88vh; width: 100vw; border-left: 0; border-top: 1px solid rgba(233,196,106,.25);
    border-radius: 22px 22px 0 0; transform: translateY(105%); }
  #profile.open { transform: none; }
  .hero h3 { font-size: 32px; }
  .sec, .hero, .foot { padding-left: 18px; padding-right: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<canvas id="motes"></canvas>

<div id="intro" aria-hidden="true">
  <div class="stage">
    <svg id="introTree" viewBox="0 0 600 470">
      <defs>
        <linearGradient id="goldGrad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#8a6526"/><stop offset=".55" stop-color="#e9c46a"/><stop offset="1" stop-color="#fff1c9"/>
        </linearGradient>
      </defs>
      <g id="branches"></g>
    </svg>
    <h1 id="introTitle"></h1>
    <div class="tag">Ten generations · 1722 to today</div>
  </div>
  <div class="skip">Click to enter</div>
</div>

<header>
  <div class="brand">
    <h2>The Marson Family</h2>
    <p id="stats"></p>

  { id: "johnfm", name: "John Frederick Marson", sex: "m", b: "12 Oct 1849", place: "St George's, Birmingham", conf: "probable",

  { id: "jamesmsr", name: "James Marson", sex: "m", b: "c.1780", place: "Birmingham", conf: "probable",
    story: "The earliest Marson found so far, Ethan's 6× great-grandfather. He and Martha baptised at least five children in Birmingham between 1806 and 1814, mostly at St Martin's in the Bull Ring, the town's ancient parish church. In those years Birmingham was booming as the 'toyshop of Europe', making buttons, buckles, guns and brassware.",

  { id: "jamesmarson", name: "James Marson", sex: "m", b: "26 Dec 1805", place: "Birmingham", conf: "probable",
    father: "jamesmsr", mother: "marthamarson",
    story: "A gun stocker: the craftsman who shaped and fitted the wooden stock of a gun. In the 1850s Birmingham's Gun Quarter, around St Mary's and Steelhouse Lane, made most of Britain's guns, including muskets for the army and for export around the world. James was born in Birmingham around 1807 and raised at least six children in St George's parish. He was born on 26 Dec 1805, the son of James and Martha Marson of St Martin's parish. His younger brother Henry (baptised 1812) was living with him in 1851, and that's what links the two families. He and Sarah had at least seven children over 24 years: James Heath (1827), Emma (c.1832), Mary Ann (1836), Sarah (1838), Caroline (1843), John Frederick (1849) and Adelaine (1851). The family name was sometimes written 'Marston' by the clergy.",

  { id: "sarahmarson", name: "Sarah Marson", maiden: "Heath", sex: "f", b: "c.1806", place: "Birmingham", conf: "confirmed",
    story: "Sarah Heath was born in Birmingham around 1806. She and James Marson had their first son, James Heath Marson, in 1827, and gave him her surname as his middle name. They didn't marry until 26 Feb 1836, at the old church of St Edburgha in Yardley, by which time they already had several children. That was unusual and a bit scandalous in the 1830s. She went on to have more children, including your ancestor John Frederick in 1849, when she was in her forties.",

  { id: "jwt1881", name: "James William Trueman", sex: "m", b: "c.1881", place: "Birmingham", conf: "confirmed",

    facts: [["c.1881", "Born", "Birmingham"], ["1906 (claimed)", "Told the 1911 census he had married Mary in 1906", ""], ["Apr–Jun 1916", "Married Mary A. Carthy (officially)", "Birmingham"], ["1911", "Silversmith in an electro-plate works, living in Deritend", "Birmingham"], ["1918–1932", "On Birmingham electoral registers", "Birmingham"], ["1921", "Brass strip caster (out of work), 27 Charles Henry Street, with May and children Mary Ann (14), James (12) and Harry (3)", "Deritend, Birmingham"]],
    story: "Nan Jillian's grandad. A Birmingham metalworker: a silversmith in an electro-plating works in 1911, and a brass strip caster in 1921, though he was out of work that June, like many in the post-war slump. He lived all his married life around Deritend. He and Mary (May) Carthy had Mary Ann in 1907 and James William in 1910, and told the 1911 census they'd married in 1906. In fact they only married officially in spring 1916, ten years later. A third child, Harry, followed in 1917. His exact birth is still uncertain: he gave ages that point to anywhere between 1876 and 1881.",
    ev: [{ k: "record", t: "Ruled out: a WWI pension card for a James William Trueman with next of kin Mary is for a soldier who DIED in the war, so it's not ours (ours was alive in 1921).", url: "https://www.ancestry.co.uk/search/collections/61588/records/21537648" },
         { k: "census", y: 1891, t: "Lead only: James W. Trueman, 15, born Aston, son of James (53) and Emma Trueman, Bordesley (Deritend sub-district), with sister Leah, married sister Emily Lancaster and her family. The age is about 3 years off, so not proven.", url: "https://www.ancestry.co.uk/search/collections/6598/records/10418180" },
         { k: "bmd", t: "Marriage registered Apr–Jun 1916, Birmingham: James W. Trueman and Mary A. Carthy (civil index via Ancestry). This was ten years after the '1906' they gave in the 1911 census, and probably took place at the register office, since it isn't in the church registers.", url: "https://www.ancestry.co.uk/search/?name=Mary_Carthy&spouse=James_Trueman" },
         { k: "census", y: 1921, t: "James W. Trueman, head, 42 yrs 6 mths, born Birmingham, brass strip caster, out of work. 27 Charles Henry St, St Martin & Deritend ward. Wife May (39 yrs 7 mths), Mary Ann (14), James W. (12), Harry (3 yrs 10 mths).", url: "https://www.ancestry.co.uk/search/collections/63150/records/19970402" },
         cen(1911, "James William Trueman, 30, head, silversmith (electro-plate manufacturer), born Birmingham, married 1906. Wife Mary, 30, born Lichfield; children Mary (4) and James William (1). Deritend, Birmingham.", "https://www.familysearch.org/ark:/61903/1:1:XWZ9-V24"), tree("GND5-FBS", "Shared tree entry (no parents yet)."),
         { k: "bmd", t: "No James (William) Trueman birth in Birmingham or Aston 1879–83 in the GRO index (checked by Ethan). The Romford 1881 James William (mother Cartwright) is a different man who lived in Barking. Possible lead: James TRUMAN, registered Oct–Dec 1879, Birmingham, mother's maiden name MAYO. He'd be the son of Alfred Thomas Truman and Ada Anne Mayo (married 7 Dec 1873, Aston), who were in Maidstone, Kent by 1881. Not proven.", ref: "1879 D Quarter · Birmingham · Vol 6d · Page 181", url: "https://www.gro.gov.uk/gro/content/certificates/" }] },
  { id: "maryt", name: "Mary Trueman", maiden: "Carthy", sex: "f", b: "c.1881", place: "Lichfield, Staffordshire", conf: "confirmed",

  { id: "rose", name: "Rose Louisa Hathaway", maiden: "Hewitt", sex: "f", b: "c.1883", d: "late 1953", place: "Birmingham", conf: "probable",

  { id: "richardhsr", name: "Richard Hathaway", sex: "m", b: "May 1789", d: "7 Aug 1853", place: "Broadwell, near Stow-on-the-Wold", conf: "confirmed",

  if (ev.length > 6) { const step = (ev.length - 1) / 5; ev = [0, 1, 2, 3, 4, 5].map(i => ev[Math.round(i * step)]); }

const cardYears = p => p.living ? (p.b ? "b. " + shortYear(p.b) : "Living") : (p.b || p.d) ? `${shortYear(p.b) || "?"} – ${shortYear(p.d) || "?"}` : "";
function relation(p) {
  if (p.id === ROOT) return "This is you";
  if (p.id === "angelina") return "Your sister";
  const m = p.sex === "m", g = p.g;
  let r = g === 1 ? (m ? "Your dad" : "Your mum") : g === 2 ? (m ? "Your grandfather" : "Your grandmother")
        : g === 3 ? (m ? "Your great-grandfather" : "Your great-grandmother")
        : `Your ${g - 2}× great-grand${m ? "father" : "mother"}`;
  if (g >= 2) r += p.line === "dad" ? " · Dad's side" : " · Mum's side";
  return r;

function genLabel(g) { return ["You", "Parents", "Grandparents", "Great-grandparents"][g] || `${g - 2}× great-grandparents`; }

/* ---------- Layout (contour-based pedigree) ---------- */
const W = 210, H = 108, GX = 30, VS = 210, ROOT_W = 230;
function layout(id) {
  const p = P[id], f = P[p.father], m = P[p.mother];
  const self = [-W / 2, W / 2];
  if (f && m) {
    const A = layout(f.id), B = layout(m.id);
    let s = 0;
    for (let d = 0; d < Math.min(A.length, B.length); d++) s = Math.max(s, A[d][1] - B[d][0] + GX);
    f._rx = -s / 2; m._rx = s / 2;
    const c = [self];
    for (let d = 0; d < Math.max(A.length, B.length); d++) {
      const a = A[d] && [A[d][0] - s / 2, A[d][1] - s / 2], b = B[d] && [B[d][0] + s / 2, B[d][1] + s / 2];
      c.push(a && b ? [Math.min(a[0], b[0]), Math.max(a[1], b[1])] : (a || b));
    }
    return c;
  }
  const par = f || m;

ordered.forEach((p, i) => {

// generation labels

/* =========================================================

   ========================================================= */
const vp = document.getElementById("viewport");
const cam = { x: 0, y: 0, k: 1 };
const apply = () => { world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.k})`; };

let tween = null;

}

  const vh = innerWidth < 720 && document.getElementById("profile").classList.contains("open") ? innerHeight * .12 : innerHeight / 2;

/* =========================================================
   LINEAGE HIGHLIGHT
   ========================================================= */
function highlight(id) {
  document.querySelectorAll(".lit, .selected").forEach(n => n.classList.remove("lit", "selected"));
  if (!id) return;
  const p = P[id]; if (!p) return;
  let cur = p.id === "angelina" ? null : p;
  if (p.id === "angelina") { cardEls.angelina.classList.add("lit"); (linkEls[ROOT] || []).forEach(n => n.classList.add("lit")); }
  while (cur) {
    cardEls[cur.id].classList.add("lit");
    if (cur.child) (linkEls[cur.child] || []).forEach(n => n.classList.add("lit"));
    cur = P[cur.child];
  }
  cardEls[id].classList.add("selected");
}

  return dbp;
}
async function idb(mode, key, val) {
  try {
    const d = await db();
    return await new Promise(res => {
      const st = d.transaction("photos", mode === "get" ? "readonly" : "readwrite").objectStore("photos");
      const rq = mode === "get" ? st.get(key) : mode === "del" ? st.delete(key) : st.put(val, key);
      rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null);
    });
  } catch (e) { return null; }
}
const photos = {}, fromFile = new Set();
function paintPhoto(id) {
  const url = photos[id];
  document.querySelectorAll(`[data-av="${id}"]`).forEach(n => {
    n.style.backgroundImage = url ? `url("${url}")` : ""; n.classList.toggle("photo", !!url);
  });
}
function loadPhotos() {
  PEOPLE.forEach(async p => {
    const stored = await idb("get", p.id);
    if (stored) { photos[p.id] = stored; paintPhoto(p.id); return; }
    const img = new Image();
    img.onload = () => { if (!photos[p.id]) { photos[p.id] = img.src; fromFile.add(p.id); paintPhoto(p.id); } };
    img.onerror = () => {};
    img.src = `photos/${p.id}.jpg`;
  });
}
function shrink(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 700 / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = img.width * s; c.height = img.height * s;
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", 0.86));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* =========================================================
   PROFILE PANEL
   ========================================================= */
const panel = document.getElementById("profile"), scrim = document.getElementById("scrim");
const ICON = { bmd: "📜", census: "🏠", parish: "⛪", death: "🕯", tree: "🌳", family: "💬", news: "📰", record: "📁" };
const SRCNAME = e => ({ bmd: "FreeBMD · GRO index", census: e.y ? `${e.y} Census` : "Record", parish: "Parish register", death: "Death Registration Index", tree: "FamilySearch shared tree", family: "Family knowledge", news: "Newspaper", record: "Record" })[e.k] || "Record";
const confBadge = c => c === "confirmed" ? `<span class="badge ok">✓ Confirmed by records</span>` : c === "probable" ? `<span class="badge maybe">◐ Probable match</span>` : `<span class="badge fam">💬 From the family</span>`;
function personLink(p, label) {
  if (!p) return "";
  return `<button class="person-link" data-go="${p.id}" style="--side:${p.line === "dad" ? "var(--dad)" : p.line === "mum" ? "var(--mum)" : "var(--gold)"}">
    <span class="mini" data-av="${p.id}">${initials(p.name)}</span>
    <span><b>${p.name}</b><small>${label} · ${years(p)}</small></span><span class="go">→</span></button>`;
}
function openProfile(id) {
  const p = P[id]; if (!p) return;
  const side = p.line === "dad" ? "var(--dad)" : p.line === "mum" ? "var(--mum)" : "var(--gold)";
  panel.style.setProperty("--side", side);
  const parents = [P[p.father], P[p.mother]].filter(Boolean);
  const child = P[p.child];
  const spouse = PEOPLE.find(q => q.id !== p.id && q.child && q.child === p.child && p.child && q.g === p.g);
  const facts = (p.facts || []).map(([w, what, where]) => `<li>${w ? `<div class="when">${w}</div>` : ""}<div class="what">${what}</div>${where ? `<div class="where">${where}</div>` : ""}</li>`).join("");
  const sibs = (p.sib || []).map(([n, note]) => {
    const linked = n === "Angelina Marson" ? P.angelina : null;
    return linked ? personLink(linked, "Sister") :
      `<div class="person-link static"><span class="mini ghost">${initials(n)}</span><span><b>${n}</b><small>${note}</small></span></div>`;
  }).join("");
  if (!p.story && STORY[p.id]) p.story = STORY[p.id];
  const places = (PERSON_PLACES[p.id] || []).map(k => PLACES[k]).filter(Boolean);
  const world = worldAround(p);
  const heroImg = (places.find(pl => pl.img) || {}).img;
  const ev = (p.ev || []).map(e => `<div class="ev-item"><div class="src"><span class="ic">${ICON[e.k]}</span>${SRCNAME(e)}</div>
      <p>${e.t}</p>${e.ref ? `<div class="ref">${e.ref}</div>` : ""}${e.url ? `<a href="${e.url}" target="_blank" rel="noopener">Open source ↗</a>` : ""}</div>`).join("");
  panel.innerHTML = `
    <button class="close" aria-label="Close">×</button>
    <div class="hero">
      ${heroImg ? `<div class="hero-bg" style="background-image:url('${heroImg}')"></div>` : ""}
      <div class="portrait"><div class="ring"></div><div class="pic" data-av="${p.id}">${initials(p.name)}</div></div>
      <div class="rel">${relation(p)}</div>
      <h3>${p.name}</h3>
      ${p.maiden ? `<div class="nee">née ${p.maiden}</div>` : ""}
      <div class="life">${years(p)}${p.place ? ` · ${p.place}` : ""}</div>
      <div class="badges">${confBadge(p.conf)}${p.living ? `<span class="badge">Living</span>` : ""}</div>
      <div class="photo-actions">
        <label>📷 ${photos[p.id] ? "Change photo" : "Add a photo"}<input type="file" accept="image/*" id="photoIn"></label>
        ${photos[p.id] && !fromFile.has(p.id) ? `<button id="photoDel">Remove</button>` : ""}
      </div>
    </div>
    ${p.story ? `<div class="sec"><h4>Their story</h4><p class="story">${p.story}</p></div>` : ""}
    ${facts ? `<div class="sec"><h4>Life timeline</h4><ul class="tl">${facts}</ul></div>` : ""}
    <div class="sec"><h4>Family</h4><div class="people">
      ${parents.map(q => personLink(q, q.sex === "m" ? "Father" : "Mother")).join("")}
      ${spouse ? personLink(spouse, p.sex === "m" ? "Wife" : "Husband") : ""}
      ${child ? personLink(child, child.sex === "m" ? "Son" : "Daughter") : ""}
      ${p.id === "angelina" ? personLink(P.mark, "Father") + personLink(P.nadia, "Mother") + personLink(P.ethan, "Brother") : ""}
      ${!parents.length && p.id !== "angelina" && p.id !== ROOT ? `<div class="empty">Parents not found yet. This is where the trail goes cold, for now.</div>` : ""}
    </div></div>
    ${sibs ? `<div class="sec"><h4>Brothers &amp; sisters</h4><div class="people">${sibs}</div></div>` : ""}
    ${places.length ? `<div class="sec"><h4>Places in their life</h4><div class="places">${places.map(pl => `
      <a class="place" href="${pl.url}" target="_blank" rel="noopener">
        <div class="ph"${pl.img ? ` style="background-image:url('${pl.img}')"` : ""}>${pl.img ? "" : "🏰"}</div>
        <div class="pc"><b>${pl.name}</b><p>${pl.blurb}</p><small>Photo &amp; history: Wikipedia / Wikimedia Commons ↗</small></div>
      </a>`).join("")}</div></div>` : ""}
    ${world.length ? `<div class="sec"><h4>The world around them</h4><div class="world">${world.map(w => `
      <div class="wi"><span class="wy">${w.y}</span><span class="wt">${w.t}</span><span class="wa">${w.age === 0 ? "the year they were born" : "aged " + w.age}</span></div>`).join("")}</div></div>` : ""}
    ${NEXT[p.id] ? `<div class="sec"><h4>How to find out more</h4><div class="next">🔎 ${NEXT[p.id]}</div></div>` : ""}
    <div class="sec"><h4>Evidence</h4><div class="ev">${ev || `<div class="empty">No records yet.</div>`}</div></div>
    <div class="foot">Photos you add are saved in this browser only. To keep them for good, drop an image named <b>${p.id}.jpg</b> into a <b>photos</b> folder next to this file.</div>`;
  PEOPLE.forEach(q => photos[q.id] && paintPhoto(q.id));
  panel.querySelector(".close").onclick = closeProfile;
  panel.querySelectorAll("[data-go]").forEach(b => b.onclick = () => openProfile(b.dataset.go));
  const inp = panel.querySelector("#photoIn");
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try { const url = await shrink(f); photos[p.id] = url; fromFile.delete(p.id); await idb("put", p.id, url); paintPhoto(p.id); openProfile(p.id); } catch (e) { alert("Sorry, that image couldn't be read."); }
  };
  const del = panel.querySelector("#photoDel");
  if (del) del.onclick = async () => { delete photos[p.id]; await idb("del", p.id); paintPhoto(p.id); openProfile(p.id); };
  panel.scrollTop = 0;
  panel.classList.add("open"); if (innerWidth < 720) scrim.classList.add("show");
  highlight(id); focus(id); hideHint();
}
function closeProfile() { panel.classList.remove("open"); scrim.classList.remove("show"); highlight(null); }
scrim.onclick = closeProfile;
addEventListener("keydown", e => { if (e.key === "Escape") { closeProfile(); results.classList.remove("show"); } });

/* =========================================================
   SEARCH
   ========================================================= */
const q = document.getElementById("q"), results = document.getElementById("results");
let hits = [], active = 0;
function renderHits() {
  results.innerHTML = hits.map((p, i) => `<button class="${i === active ? "active" : ""}" data-id="${p.id}">${p.name}<small>${relation(p).replace("This is you", "You")} · ${years(p)}</small></button>`).join("");
  results.classList.toggle("show", hits.length > 0);
  results.querySelectorAll("button").forEach(b => b.onclick = () => pick(b.dataset.id));
}
function pick(id) { results.classList.remove("show"); q.value = ""; q.blur(); openProfile(id); }
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase(); active = 0;
  hits = s ? ordered.filter(p => (p.name + " " + (p.maiden || "") + " " + (p.place || "")).toLowerCase().includes(s)).slice(0, 12) : [];
  renderHits();
});
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { active = Math.min(hits.length - 1, active + 1); renderHits(); e.preventDefault(); }
  if (e.key === "ArrowUp") { active = Math.max(0, active - 1); renderHits(); e.preventDefault(); }
  if (e.key === "Enter" && hits[active]) pick(hits[active].id);
});
document.addEventListener("pointerdown", e => { if (!e.target.closest(".search")) results.classList.remove("show"); });

/* =========================================================
   AMBIENT MOTES
   ========================================================= */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
(function motes() {
  const c = document.getElementById("motes"), x = c.getContext("2d"); let w, h, dpr;
  const M = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + .3, s: Math.random() * .00025 + .00008, ph: Math.random() * 6.28, a: Math.random() * .5 + .2 }));
  function size() { dpr = Math.min(2, devicePixelRatio || 1); w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr; c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px"; }
  size(); addEventListener("resize", size);
  function frame(t) {
    x.clearRect(0, 0, w, h);
    for (const m of M) {
      if (!reduce) { m.y -= m.s; if (m.y < -0.02) { m.y = 1.02; m.x = Math.random(); } }
      const px = (m.x + Math.sin(t / 4000 + m.ph) * .01) * w, py = m.y * h;
      const tw = .55 + .45 * Math.sin(t / 900 + m.ph * 3);
      x.beginPath(); x.arc(px, py, m.r * dpr, 0, 6.283);
      x.fillStyle = `rgba(240,210,140,${m.a * tw})`; x.shadowBlur = 8 * dpr; x.shadowColor = "rgba(240,200,120,.8)"; x.fill();
    }
    if (!document.hidden && !reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !reduce) requestAnimationFrame(frame); });
})();

/* =========================================================
   INTRO
   ========================================================= */
function buildIntroTree() {
  const g = document.getElementById("branches"); let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const maxD = 8; let html = "";
  (function br(x, y, len, ang, d) {
    const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
    const bend = (rnd() - .5) * len * .25;
    const mx = (x + x2) / 2 + Math.cos(ang + Math.PI / 2) * bend, my = (y + y2) / 2 + Math.sin(ang + Math.PI / 2) * bend;
    html += `<path pathLength="1" d="M${x.toFixed(1)} ${y.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke-width="${Math.max(.8, (maxD - d) * 1.5)}" style="animation-delay:${(d * .2).toFixed(2)}s"/>`;
    if (d >= maxD - 1) { html += `<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="${(1.6 + rnd() * 2).toFixed(1)}" style="animation-delay:${(d * .2 + .4 + rnd() * .5).toFixed(2)}s"/>`; return; }
    const spread = .32 + rnd() * .16;
    br(x2, y2, len * (.72 + rnd() * .08), ang - spread, d + 1);
    br(x2, y2, len * (.72 + rnd() * .08), ang + spread, d + 1);
    if (d < 3 && rnd() > .55) br(x2, y2, len * .55, ang + (rnd() - .5) * .3, d + 2);
  })(300, 465, 105, -Math.PI / 2, 0);
  g.innerHTML = html;
  const t = document.getElementById("introTitle");
  t.innerHTML = "The Marson Family".split("").map((ch, i) => `<span style="animation-delay:${1.5 + i * .05}s">${ch === " " ? "&nbsp;" : ch}</span>`).join("");
}
let entered = false;
function enter() {
  if (entered) return; entered = true;
  const intro = document.getElementById("intro");
  if (intro) { intro.classList.add("out"); setTimeout(() => intro.remove(), 1300); }
  // start zoomed on Ethan, then pull back to reveal everyone
  const kk = innerWidth < 720 ? .9 : 1.25;
  cam.k = kk; cam.x = innerWidth / 2 - (coupleX + OX) * kk; cam.y = innerHeight * .62 - (OY) * kk; apply();
  requestAnimationFrame(() => {
    document.querySelectorAll(".card, .gen-tag").forEach(n => n.classList.add("in"));
    svg.querySelectorAll("path, circle").forEach(n => n.classList.add("in"));
    setTimeout(() => fitView(2600), 350);
  });
}
buildIntroTree();
loadPhotos();
if (reduce) { document.getElementById("intro").remove(); entered = false; enter(); }
else {
  document.getElementById("intro").addEventListener("click", enter);
  setTimeout(enter, 4600);
}
</script>
